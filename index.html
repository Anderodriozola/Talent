<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talent</title><meta name="description" content="Ofertas de marketing, comunicación, publicidad y eventos en Euskadi">
<style>
:root{--ink:#0b2e2a;--mint:#38d996;--paper:#f4f7f2;--amber:#f6c95f;--muted:#65736f}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;background:var(--paper);color:#12201d}header{background:radial-gradient(circle at 85% 10%,#235850,transparent 35%),var(--ink);color:#fff;padding:28px 20px 74px}.wrap{max-width:1080px;margin:auto}.brand{font-size:1.15rem;font-weight:900;letter-spacing:.18em}.hero{max-width:760px;margin-top:48px}.hero h1{font-size:clamp(2.15rem,6vw,4.5rem);line-height:1.02;margin:0}.hero p{color:#d9e5e1;font-size:1.08rem;line-height:1.65}.status{display:inline-flex;gap:8px;align-items:center;padding:7px 11px;border-radius:99px;background:#ffffff18;color:#c8f7e2;font-size:.82rem}.dot{width:8px;height:8px;background:var(--mint);border-radius:50%}.searchbox{background:#fff;padding:16px;border-radius:22px;box-shadow:0 16px 45px #061b1730;margin:-36px auto 28px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.searchbox input,.searchbox select{width:100%;border:1px solid #dfe7e3;border-radius:14px;padding:14px;background:#fafcfb;font-size:.96rem}.meta{display:flex;justify-content:space-between;gap:16px;align-items:end;margin:30px 0 15px}.meta h2{margin:0;font-size:1.55rem}.meta small{color:var(--muted)}#jobs{display:grid;gap:14px}.job{background:#fff;border-radius:22px;padding:22px;box-shadow:0 2px 12px #0d2a2210;border:1px solid #e8eeeb}.job:hover{box-shadow:0 12px 30px #0d2a2218;transform:translateY(-1px)}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:.72rem;font-weight:800;padding:5px 9px;border-radius:99px;background:#eaf8f1;color:#08704a}.chip.source{background:#fff4d6;color:#765509}.job h3{font-size:1.2rem;margin:13px 0 6px}.job p{margin:5px 0;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-top:16px}.btn{display:inline-block;background:var(--ink);color:white;text-decoration:none;padding:10px 15px;border-radius:12px;font-weight:800;font-size:.88rem}.empty{background:#fff;padding:50px;text-align:center;border-radius:22px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:.78rem;padding:50px 15px}@media(max-width:720px){header{padding-bottom:65px}.searchbox{grid-template-columns:1fr;margin-left:14px;margin-right:14px}.row{align-items:flex-end}.hero{margin-top:38px}.job{padding:18px}}
</style></head><body>
<header><div class="wrap"><div class="brand">TALENT</div><div class="hero"><span class="status"><span class="dot"></span>Selección especializada</span><h1>Oportunidades que sí encajan.</h1><p>Marketing, comunicación, publicidad, contenidos, marca, eventos y medios en Euskadi. Sin ingeniería ni resultados de relleno.</p></div></div></header>
<main class="wrap"><section class="searchbox"><input id="q" placeholder="Buscar puesto o empresa"><select id="province"><option value="">Todas las provincias</option><option>Bizkaia</option><option>Gipuzkoa</option><option>Álava</option><option>Remoto</option></select><select id="category"><option value="">Todas las áreas</option></select></section><div class="meta"><div><small>SELECCIÓN ACTUAL</small><h2><span id="count">0</span> ofertas</h2></div><small id="updated">Cargando…</small></div><section id="jobs"></section></main><footer>Talent · Las candidaturas se realizan siempre en la web de origen.</footer>
<script>
let all=[]; const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=norm(document.querySelector('#q').value),p=norm(document.querySelector('#province').value),c=norm(document.querySelector('#category').value);const rows=all.filter(j=>norm([j.title,j.company,j.location,j.source,j.category].join(' ')).includes(q)&&(!p||norm(j.province)===p)&&(!c||norm(j.category)===c));document.querySelector('#count').textContent=rows.length;document.querySelector('#jobs').innerHTML=rows.length?rows.map(j=>`<article class="job"><div class="chips"><span class="chip">${esc(j.category||'Comunicación')}</span><span class="chip source">${esc(j.source)}</span></div><h3>${esc(j.title)}</h3><p><strong>${esc(j.company||'Empresa no indicada')}</strong></p><p>${esc(j.location||'Euskadi')}${j.date?' · '+esc(j.date):''}</p><div class="row"><small>${j.is_new?'● Nueva o reciente':''}</small><a class="btn" href="${esc(j.url)}" target="_blank" rel="noopener">Ver oferta →</a></div></article>`).join(''):'<div class="empty">No hay ofertas que coincidan con estos filtros.</div>'}
fetch('jobs.json?'+Date.now()).then(r=>r.json()).then(d=>{all=d.jobs||[];document.querySelector('#updated').textContent='Actualizado: '+(d.updated_at||'sin fecha');const cats=[...new Set(all.map(j=>j.category).filter(Boolean))].sort();document.querySelector('#category').innerHTML='<option value="">Todas las áreas</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join('');render()}).catch(()=>{document.querySelector('#updated').textContent='No se pudieron cargar las ofertas';render()});['q','province','category'].forEach(id=>document.querySelector('#'+id).addEventListener(id==='q'?'input':'change',render));
</script></body></html>
